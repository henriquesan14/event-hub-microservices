services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: eventhub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - eventhub-rabbitmq-data:/var/lib/rabbitmq

volumes:
  eventhub-rabbitmq-data:
