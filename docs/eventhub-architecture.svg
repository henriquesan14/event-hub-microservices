<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="pinkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Arial,sans-serif;fill:#1d2522}.title{font-size:28px;font-weight:700}.head{font-size:16px;font-weight:700}.sub{font-size:12px;fill:#52525b}.box{rx:14;stroke-width:2;filter:url(#shadow)}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.event{fill:none;stroke:#e11d48;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#pinkArrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">EventHub — Arquitetura de Microservices</text>

  <rect class="box" x="35" y="90" width="210" height="70" fill="#e0f2fe" stroke="#0284c7"/><text x="140" y="118" text-anchor="middle" class="head">Usuários</text><text x="140" y="141" text-anchor="middle" class="sub">Participante · Organizer · Admin</text>
  <rect class="box" x="300" y="90" width="220" height="70" fill="#e0f2fe" stroke="#0284c7"/><text x="410" y="118" text-anchor="middle" class="head">Angular 22</text><text x="410" y="141" text-anchor="middle" class="sub">Signals · SignalR · Cookies</text>
  <rect class="box" x="575" y="90" width="220" height="70" fill="#fef3c7" stroke="#d97706"/><text x="685" y="118" text-anchor="middle" class="head">API Gateway</text><text x="685" y="141" text-anchor="middle" class="sub">YARP · Auth · Rate limit</text>
  <rect class="box" x="905" y="90" width="185" height="70" fill="#f3f4f6" stroke="#6b7280"/><text x="998" y="118" text-anchor="middle" class="head">Asaas</text><text x="998" y="141" text-anchor="middle" class="sub">Cobranças · Estornos</text>
  <rect class="box" x="1160" y="90" width="185" height="70" fill="#f3f4f6" stroke="#6b7280"/><text x="1253" y="118" text-anchor="middle" class="head">Mailtrap SMTP</text><text x="1253" y="141" text-anchor="middle" class="sub">E-mails HTML + QR</text>

  <path class="line" d="M245 125H300"/><path class="line" d="M520 125H575"/>
  <path class="line" d="M795 125H905"/><text x="850" y="115" text-anchor="middle" class="sub">HTTPS</text>

  <rect x="35" y="225" width="1310" height="250" rx="18" fill="#fff" stroke="#a1a1aa" stroke-width="2"/><text x="60" y="258" class="head" fill="#52525b">MICROSERVICES</text>
  <g>
    <rect class="box" x="60" y="300" width="155" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="138" y="330" text-anchor="middle" class="head">Identity</text><text x="138" y="354" text-anchor="middle" class="sub">Usuários e auth</text>
    <rect class="box" x="245" y="300" width="145" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="318" y="330" text-anchor="middle" class="head">Event</text><text x="318" y="354" text-anchor="middle" class="sub">Eventos</text>
    <rect class="box" x="420" y="300" width="155" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="498" y="330" text-anchor="middle" class="head">Ticketing</text><text x="498" y="354" text-anchor="middle" class="sub">Tipos e reservas</text>
    <rect class="box" x="605" y="300" width="155" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="683" y="330" text-anchor="middle" class="head">Order</text><text x="683" y="354" text-anchor="middle" class="sub">Pedidos + Saga</text>
    <rect class="box" x="790" y="300" width="155" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="868" y="330" text-anchor="middle" class="head">Payment</text><text x="868" y="354" text-anchor="middle" class="sub">Asaas + webhook</text>
    <rect class="box" x="975" y="300" width="155" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="1053" y="330" text-anchor="middle" class="head">Admission</text><text x="1053" y="354" text-anchor="middle" class="sub">QR + check-in</text>
    <rect class="box" x="1160" y="300" width="160" height="82" fill="#ede9fe" stroke="#7c3aed"/><text x="1240" y="330" text-anchor="middle" class="head">Notification</text><text x="1240" y="354" text-anchor="middle" class="sub">E-mail + realtime</text>
  </g>
  <path class="line" d="M685 160V225"/><path class="line" d="M868 300V195H998V160"/><text x="920" y="190" text-anchor="middle" class="sub">API / webhook</text>
  <path class="line" d="M1240 300V195H1253V160"/><text x="1210" y="190" text-anchor="middle" class="sub">SMTP</text>

  <rect class="box" x="390" y="535" width="560" height="80" fill="#ffe4e6" stroke="#e11d48"/><text x="670" y="566" text-anchor="middle" class="head">RabbitMQ</text><text x="670" y="591" text-anchor="middle" class="sub">Exchanges · filas · Publish / Subscribe · retries</text>
  <path class="event" d="M670 475V535"/><path class="event" d="M590 535V475"/>
  <rect class="box" x="1010" y="535" width="300" height="80" fill="#fff7ed" stroke="#ea580c"/><text x="1160" y="566" text-anchor="middle" class="head">Transactional Outbox</text><text x="1160" y="591" text-anchor="middle" class="sub">Persistência + publicação confiável</text><path class="event" d="M1010 575H950"/>

  <rect class="box" x="55" y="690" width="250" height="95" fill="#dcfce7" stroke="#16a34a"/><text x="180" y="723" text-anchor="middle" class="head">PostgreSQL</text><text x="180" y="748" text-anchor="middle" class="sub">Database per Service</text><text x="180" y="767" text-anchor="middle" class="sub">7 bancos independentes</text>
  <rect class="box" x="365" y="690" width="260" height="95" fill="#f3f4f6" stroke="#6b7280"/><text x="495" y="723" text-anchor="middle" class="head">Grafana LGTM</text><text x="495" y="748" text-anchor="middle" class="sub">Traces · Logs · Métricas</text><text x="495" y="767" text-anchor="middle" class="sub">OpenTelemetry / OTLP</text>
  <rect class="box" x="690" y="675" width="620" height="125" fill="#fef2f2" stroke="#dc2626"/><text x="1000" y="708" text-anchor="middle" class="head">Fluxo de estorno</text><text x="1000" y="737" text-anchor="middle" class="sub">PAYMENT_REFUNDED → Payment publica um Integration Event</text><text x="1000" y="762" text-anchor="middle" class="sub">Order reembolsado · estoque devolvido · QR Codes cancelados · usuário notificado</text>
  <path class="line" d="M180 475V690"/><path class="line" d="M495 475V690"/><path class="event" d="M670 615V675H850"/>

  <rect x="55" y="860" width="1290" height="60" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="700" y="886" text-anchor="middle" class="head">Fluxo principal</text><text x="700" y="908" text-anchor="middle" class="sub">Reserva → Pedido/Saga → Pagamento Asaas → Webhook → Emissão do ingresso → E-mail + SignalR</text>
</svg>
