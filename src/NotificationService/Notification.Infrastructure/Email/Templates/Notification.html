<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#27272a;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);">
          <tr>
            <td style="height:6px;background-color:{{accentColor}};"></td>
          </tr>
          <tr>
            <td style="padding:36px 40px 16px;">
              <div style="width:52px;height:52px;line-height:52px;text-align:center;border-radius:50%;background-color:{{accentColor}};color:#ffffff;font-size:26px;font-weight:bold;">
                {{icon}}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 40px;">
              <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#52525b;">Olá, {{recipientName}}!</p>
              <h1 style="margin:0 0 16px;font-size:28px;line-height:36px;color:#18181b;">{{title}}</h1>
              <p style="margin:0;font-size:16px;line-height:26px;color:#52525b;">{{message}}</p>
              {{actionBlock}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px;background-color:#fafafa;border-top:1px solid #e4e4e7;">
              <p style="margin:0 0 6px;font-size:14px;font-weight:bold;color:#3f3f46;">EventHub</p>
              <p style="margin:0;font-size:12px;line-height:18px;color:#71717a;">
                Esta é uma mensagem automática. Por favor, não responda.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;font-size:11px;color:#a1a1aa;">© {{year}} EventHub</p>
      </td>
    </tr>
  </table>
</body>
</html>
